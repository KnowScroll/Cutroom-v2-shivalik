<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Design: lld/03 §2.10; impl/02 §6, §9 (A:env-3, A:env-4)
     The one font configuration Chrome reads (FONTCONFIG_FILE). It includes nothing from /etc/fonts, so the
     system fonts stay hidden. Both directories are written with "~", which fontconfig 2.13.1 expands to the
     user's home, so the file names no machine path and is the same text on every machine (A:env-3). A
     prefix="relative" directory was measured to resolve against the process's working directory in 2.13.1,
     not against this file, so it is not used. -->

<fontconfig>
  <dir>~/.cutroom-build/.tools/fonts</dir>
  <cachedir>~/.cutroom-build/.tools/fontconfig-cache</cachedir>

  <!-- Generic families, each followed by the fallbacks for CJK, Arabic, Hebrew, maths, symbols and emoji. -->
  <alias binding="same">
    <family>sans-serif</family>
    <prefer>
      <family>Inter</family>
      <family>Noto Sans</family>
      <family>Noto Sans CJK SC</family>
      <family>Noto Sans Arabic</family>
      <family>Noto Sans Hebrew</family>
      <family>Noto Sans Math</family>
      <family>Noto Sans Symbols 2</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>
  <alias binding="same">
    <family>serif</family>
    <prefer>
      <family>Noto Serif</family>
      <family>Noto Serif CJK SC</family>
      <family>Noto Naskh Arabic</family>
      <family>Noto Sans Hebrew</family>
      <family>Noto Sans Math</family>
      <family>Noto Sans Symbols 2</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>
  <alias binding="same">
    <family>monospace</family>
    <prefer>
      <family>JetBrains Mono</family>
      <family>Noto Sans CJK SC</family>
      <family>Noto Sans Symbols 2</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>
  <alias binding="same">
    <family>emoji</family>
    <prefer>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>

  <!-- Greyscale anti-aliasing, no hinting (R2 §2.10). -->
  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>false</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintnone</const></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
    <edit name="autohint" mode="assign"><bool>false</bool></edit>
  </match>
</fontconfig>
